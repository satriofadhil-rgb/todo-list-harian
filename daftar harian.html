<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas Harian</title>
    <!-- Memanggil Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Warna latar belakang yang lembut */
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <header class="text-center md:text-left bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">📝 Daftar Tugas Harian</h1>
            <p class="text-slate-500 mt-1">Catat aktivitas dan jadikan hari Anda lebih produktif.</p>
        </header>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <form id="form-kegiatan" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:flex-1">
                    <label for="input-tugas" class="block text-sm font-medium text-slate-700 mb-1">Nama Kegiatan</label>
                    <input type="text" id="input-tugas" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="Contoh: Mengerjakan tugas Kalkulus / Rapat BEM">
                </div>
                
                <div class="w-full md:w-48">
                    <label for="input-prioritas" class="block text-sm font-medium text-slate-700 mb-1">Prioritas</label>
                    <select id="input-prioritas" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-white">
                        <option value="Tinggi">🔴 Tinggi</option>
                        <option value="Sedang">🟡 Sedang</option>
                        <option value="Rendah">🟢 Rendah</option>
                    </select>
                </div>

                <button type="submit" class="w-full md:w-auto px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                    Tambah
                </button>
            </form>
        </div>

        <!-- Tabel Data -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                            <th class="py-4 px-6 font-semibold w-12 text-center">No</th>
                            <th class="py-4 px-6 font-semibold">Rencana Kegiatan</th>
                            <th class="py-4 px-6 font-semibold w-32">Prioritas</th>
                            <th class="py-4 px-6 font-semibold w-24 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body" class="divide-y divide-slate-100">
                        <!-- Baris data akan dimasukkan oleh JavaScript di sini -->
                    </tbody>
                </table>
            </div>

            <!-- Tampilan jika daftar kosong -->
            <div id="pesan-kosong" class="text-center py-12 text-slate-500 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 Tentu! Berikut adalah kode lengkap untuk **Aplikasi Daftar Tugas Harian (To-Do List)**. 

Aplikasi ini didesain sangat bersih dan minimalis menggunakan Tailwind CSS. Terdapat form untuk memasukkan **waktu** dan **nama tugas**, sebuah tabel untuk menampilkan daftarnya, tombol hapus, dan integrasi *Local Storage* agar data Anda aman dari *refresh*.

Silakan salin seluruh kode di bawah ini, simpan dengan nama **`index.html`**, dan buka langsung di *browser* Anda:

```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas Harian</title>
    <!-- Memuat Tailwind CSS melalui CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Warna latar belakang abu-abu sangat terang */
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-10">

    <div class="max-w-3xl mx-auto space-y-8">
        
        <!-- Header Aplikasi -->
        <header class="text-center">
            <h1 class="text-3xl font-bold text-slate-900">📝 Daftar Harian</h1>
            <p class="text-slate-500 mt-2">Catat dan selesaikan target harianmu dengan rapi.</p>
        </header>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <form id="form-harian" class="flex flex-col md:flex-row gap-4">
                <!-- Input Waktu -->
                <div class="w-full md:w-1/4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Waktu</label>
                    <input type="time" id="input-waktu" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <!-- Input Nama Tugas -->
                <div class="w-full md:w-2/4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tugas / Agenda</label>
                    <input type="text" id="input-tugas" required placeholder="Contoh: Mengerjakan revisi skripsi..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <!-- Tombol Submit -->
                <div class="w-full md:w-1/4 flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors">
                        Tambah
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Menampilkan Data -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                            <th class="py-4 px-6 w-1/5 font-semibold">Waktu</th>
                            <th class="py-4 px-6 w-3/5 font-semibold">Agenda Harian</th>
                            <th class="py-4 px-6 w-1/5 font-semibold text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body" class="divide-y divide-slate-100">
                        <!-- Data akan dimasukkan oleh JavaScript di sini -->
                    </tbody>
                </table>
            </div>

            <!-- Pesan jika daftar kosong -->
            <div id="pesan-kosong" class="text-center py-12 text-slate-500 hidden">
                <p class="text-lg font-medium">Belum ada agenda hari ini.</p>
                <p class="text-sm">Yuk, tambahkan tugas barumu di atas!</p>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // 1. Inisialisasi Data dari Local Storage
        // Jika ada data lama, ambil. Jika tidak ada, buat array kosong [].
        let daftarHarian = JSON.parse(localStorage.getItem('dataAgendaHarian')) || [];

        // Menangkap elemen HTML
        const formHarian = document.getElementById('form-harian');
        const tabelBody = document.getElementById('tabel-body');
        const pesanKosong = document.getElementById('pesan-kosong');

        // 2. Fungsi untuk menampilkan data ke dalam tabel
        function renderTabel() {
            // Bersihkan isi tabel
            tabelBody.innerHTML = '';
            
            // Cek apakah array kosong
            if (daftarHarian.length === 0) {
                pesanKosong.classList.remove('hidden'); // Tampilkan pesan kosong
            } else {
                pesanKosong.classList.add('hidden'); // Sembunyikan pesan kosong
                
                // Urutkan tugas berdasarkan waktu (opsional tapi membuat rapi)
                daftarHarian.sort((a, b) => a.waktu.localeCompare(b.waktu));

                // Loop setiap tugas dan buatkan baris (tr)
                daftarHarian.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50 transition-colors';
                    
                    row.innerHTML = `
                        <td class="py-3 px-6 text-sm font-semibold text-blue-600">
                            ${item.waktu}
                        </td>
                        <td class="py-3 px-6 text-slate-800 font-medium">
                            ${item.tugas}
                        </td>
                        <td class="py-3 px-6 text-center">
                            <button onclick="hapusTugas(${index})" class="text-red-500 hover:text-red-700 p-2 bg-red-50 hover:bg-red-100 rounded-lg transition-colors" title="Hapus Tugas">
                                <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </td>
                    `;
                    tabelBody.appendChild(row);
                });
            }
        }

        // 3. Menambahkan tugas baru saat form di-submit
        formHarian.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman

            // Buat objek tugas baru
            const agendaBaru = {
                waktu: document.getElementById('input-waktu').value,
                tugas: document.getElementById('input-tugas').value
            };

            // Masukkan ke array
            daftarHarian.push(agendaBaru);

            // Simpan array ke Local Storage
            localStorage.setItem('dataAgendaHarian', JSON.stringify(daftarHarian));

            // Kosongkan form input
            formHarian.reset();

            // Tampilkan ulang isi tabel
            renderTabel();
        });

        // 4. Fungsi untuk menghapus tugas
        function hapusTugas(index) {
            // Berikan peringatan konfirmasi sebelum menghapus
            if (confirm('Apakah Anda yakin ingin menghapus agenda ini?')) {
                // Hapus 1 item berdasarkan index-nya
                daftarHarian.splice(index, 1);
                
                // Simpan perubahan ke Local Storage
                localStorage.setItem('dataAgendaHarian', JSON.stringify(daftarHarian));
                
                // Tampilkan ulang isi tabel
                renderTabel();
            }
        }

        // 5. Jalankan fungsi renderTabel() saat pertama kali halaman dimuat
        renderTabel();
    </script>
</body>
</html>
